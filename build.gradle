plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.civicdata.directory'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Keep Fuseki's standalone server separate from Spring Boot's dependencies.
sourceSets {
    fuseki
}

// In-process tests use Fuseki's bundled Log4j rather than Spring's logging bridge.
configurations.testRuntimeClasspath {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    fusekiImplementation 'org.apache.jena:jena-fuseki-server:6.2.0'
    testImplementation sourceSets.fuseki.output
    testImplementation files(configurations.fusekiRuntimeClasspath)
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'directory-api.jar'
}

tasks.named('jar') {
    enabled = false
}

tasks.register('fusekiJar', Jar) {
    archiveFileName = 'directory-fuseki.jar'
    from sourceSets.fuseki.output
    manifest.attributes 'Main-Class': 'de.civicdata.directory.fuseki.DirectoryFuseki'
    doFirst {
        manifest.attributes 'Class-Path': configurations.fusekiRuntimeClasspath.collect { it.name }.join(' ')
    }
}

tasks.register('fusekiDist', Sync) {
    from tasks.named('fusekiJar')
    from configurations.fusekiRuntimeClasspath
    into layout.buildDirectory.dir('fuseki')
}

tasks.named('assemble') {
    dependsOn 'fusekiDist'
}
