plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.civicdata.directory'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Keep Fuseki's standalone server separate from Spring Boot's dependencies.
configurations {
    fuseki
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    fuseki 'org.apache.jena:jena-fuseki-server:6.2.0'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'fusekiDist'
    inputs.file('fuseki.ttl')
    inputs.files(configurations.fuseki)
}

tasks.named('bootJar') {
    archiveFileName = 'directory-api.jar'
}

tasks.named('jar') {
    enabled = false
}

tasks.register('fusekiDist', Sync) {
    from configurations.fuseki
    into layout.buildDirectory.dir('fuseki')
    rename { 'fuseki-server.jar' }
}

tasks.named('assemble') {
    dependsOn 'fusekiDist'
}
