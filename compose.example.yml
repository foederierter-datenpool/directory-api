# Copy this and Dockerfile.example into your instance as compose.yml and Dockerfile.
services:
  api:
    image: &directory-image example-directory-api:local
    pull_policy: never
    build:
      context: .
      no_cache: true
      pull: true
      args:
        SNAPSHOT_URL: https://codeload.github.com/YOUR-ORG/YOUR-REPO/tar.gz/refs/heads/pipeline-data
    environment:
      SPRING_APPLICATION_NAME: example-directory-api
      DIRECTORY_API_FILE: /app/snapshot/data/directory.ttl
      DIRECTORY_API_SPARQL_URL: http://fuseki:3030/directory/sparql
    depends_on:
      fuseki:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    # Uncomment to access the API locally on port 18080.
    # ports:
    #   - "127.0.0.1:18080:8080"

  fuseki:
    image: *directory-image
    pull_policy: never
    entrypoint: ["java", "-jar", "/app/fuseki/directory-fuseki.jar"]
    command: ["/app/snapshot"]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3030/directory/sparql?query=ASK%7B%7D"]
    # ports:
    #   - "127.0.0.1:3030:3030"
