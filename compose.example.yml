# Copy this and Dockerfile.example to compose.yml and Dockerfile in your instance.
services:
  api:
    build:
      context: .
      no_cache: true
      pull: true
      args:
        DIRECTORY_SOURCE_URL: https://example.org/data/directory.ttl
    environment:
      SPRING_APPLICATION_NAME: example-directory-api
    mem_limit: 512m
    restart: unless-stopped
    # Uncomment to access the API locally on port 18080.
    # ports:
    #   - "127.0.0.1:18080:8080"
